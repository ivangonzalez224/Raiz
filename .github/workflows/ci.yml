name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/raiz_test?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/raiz_test?schema=public"
  NEXTAUTH_SECRET: "ci-test-secret"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  lint-and-unit:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Chequeo de formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitarios
        run: npm run test

  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma y aplicar schema
        run: |
          npm run db:generate
          npm run db:push

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Tests e2e
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7